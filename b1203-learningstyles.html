<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B1.2: Discussing Ways to Learn Something New</title>

    <style>
        :root {
            --bg-color: #78025B;
            --sheet-color: #FFF1EB;
            --text-color: #0B0A09;
            --error-color: #E54B4B;
            --correct-color: #44CF6C;
            --accent-color: #A91D7A;
            --subtle-gray: #E8DCD6;
            --card-shadow: 0 8px 24px rgba(120, 2, 91, 0.15);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 40px 20px 120px 20px;
            display: flex;
            justify-content: center;
            line-height: 1.6;
        }

        .worksheet-container {
            background-color: var(--sheet-color);
            max-width: 950px;
            width: 100%;
            border-radius: 20px;
            padding: 50px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
        }

        header {
            margin-bottom: 40px;
            padding-bottom: 25px;
            border-bottom: 2px solid var(--subtle-gray);
        }

        .level-tag {
            background-color: var(--text-color);
            color: var(--sheet-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            color: var(--bg-color);
            font-weight: 800;
            font-size: 2.8em;
            margin: 15px 0 5px 0;
            line-height: 1.1;
        }

        header p {
            font-size: 1.1em;
            color: #555;
            margin: 0;
            font-weight: 500;
        }

        /* Knowledge Base Section */
        .knowledge-section {
            background: #ffffff;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 40px;
            box-shadow: var(--card-shadow);
            border-left: 6px solid var(--bg-color);
        }

        .knowledge-section h2 {
            color: var(--bg-color);
            margin-top: 0;
            font-size: 1.4em;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--subtle-gray);
            padding-bottom: 10px;
        }

        .vocab-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .vocab-item {
            background: var(--sheet-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95em;
        }

        .vocab-item strong { color: var(--bg-color); }

        .example-box {
            background-color: rgba(120, 2, 91, 0.05);
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-style: italic;
            border-left: 3px solid var(--accent-color);
        }

        /* Exercise Sections */
        .exercise-block {
            margin-bottom: 50px;
        }

        .exercise-header {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 25px;
        }

        .exercise-number {
            background-color: var(--bg-color);
            color: #fff;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
            font-weight: 700;
            border-radius: 10px;
            flex-shrink: 0;
        }

        .exercise-title h3 {
            margin: 0 0 5px 0;
            color: var(--text-color);
            font-size: 1.3em;
        }

        .exercise-title p {
            margin: 0;
            color: #666;
            font-size: 0.95em;
        }

        /* Question Layouts */
        .question {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border: 1px solid var(--subtle-gray);
